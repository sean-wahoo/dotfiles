unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

bind N command-prompt -p "new window in dir " -I '#{pane_current_path}' "new-window -c %1"

unbind '"'
unbind %

bind r source-file ~/.tmux.conf

set -g mouse on

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-j select-pane -D
bind -n M-k select-pane -U

set -g default-terminal "alacritty"
set-option -sa terminal-overrides ",alacritty*:Tc"


set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

setw -g clock-mode-colour yellow
setw -g mode-style 'fg=black bg=green bold'

set -g pane-border-style 'fg=green'
set -g pane-active-border-style 'fg=blue'

set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=green'

setw -g window-status-current-style 'fg=black bg=green'
setw -g window-status-current-format ' #I #[fg=black]#W #[fg=black]#F '

setw -g window-status-bell-style 'fg=blue bg=green bold'

setw -g window-status-style 'fg=green bg=black'
setw -g window-status-format ' #I #[fg=green]#W #[bg=black]#F '
